site_name: vita49io
site_description: VITA 49 packet parsing and synthesis utilities
site_url: https://example.com/vita49io
theme:
  name: material
  features:
    - navigation.sections
    - navigation.tabs
    - content.code.annotate
    - content.code.copy
nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Guides:
      - Common Tasks: guides/common-tasks.md
  - Reference:
      - API Reference: reference/vita49io.md
  - FAQ: faq.md
  - AI Integrations: ai-integrations.md
  - Changelog: changelog.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
