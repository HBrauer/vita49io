[project]
name = "vita49io"
description = "VITA 49 (VRT) packet read/write utilities"
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "H. Brauer" }]
license = { text = "LICENSE" }
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "numpy>=1.20",
  "scipy>=1.7",
]
dynamic = ["version"]

[project.scripts]
vita-ddc = "vita49io.scripts.ddc_v49_file:main"
vita-read = "vita49io.scripts.read_v49_file:main"
vita-waterfall = "vita49io.scripts.waterfall_frequency_domain_v49:main"

[build-system]
requires = [
  "setuptools>=61.0",
  "setuptools-scm>=8",
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vita49io = ["py.typed"]

[tool.setuptools_scm]
# Default configuration is fine; recognizes tags like v0.1.0
