[project]
name = "vita49io"
version = "0.1.0"
description = "VITA 49 (VRT) packet read/write utilities"
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "H. Brauer" }]
license = { text = "LICENSE" }
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "numpy>=1.20",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vita49io = ["py.typed"]
