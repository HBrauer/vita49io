# Decimator configuration for examples/ddc_v49_file.py
#
# Each [[decimator.paths]] entry defines one supported conversion path.
# Each path may use one or more [[decimator.paths.stages]] for multi-stage
# decimation/resampling.
#
# Path-level fields:
# - input_sample_rate: input stream sample rate (Hz)
# - output_sample_rate: requested output sample rate (Hz)
# - bandwidth: output bandwidth used in output context packets (Hz)
#
# Stage-level fields:
# - input_sample_rate: stage input sample rate (Hz)
# - output_sample_rate: stage output sample rate (Hz)
# - taps: FIR coefficients for this stage (float32-friendly values)
#
# Notes:
# - Replace taps below with your real designed coefficients.
# - Stages must chain continuously:
#   stage[n].output_sample_rate == stage[n+1].input_sample_rate
# - First stage input and last stage output must match the path-level rates.
# - Identity stages (same in/out rate) may omit taps.

[[decimator.paths]]
input_sample_rate = 1536000
output_sample_rate = 128000
bandwidth = 10000

[[decimator.paths.stages]]
input_sample_rate = 1536000
output_sample_rate = 128000
taps = [
  -0.001,
  0.0,
  0.01,
  0.0,
  -0.001,
]

